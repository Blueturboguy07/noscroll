# bugfix-lab controlled environment for noscroll-android-blocking-not-active.
# Manual dispatch only. Builds the debug APK, boots a real Android emulator
# (a genuine mobile simulator, matching this cluster's repro_env), installs
# the app, launches it once (first run), grants the accessibility permission
# the way pairing does, and reads back the persisted shield-list store the
# same way a reporter's own device would hold it.
#
# Prints BUGFIX_LAB_PRESENT (exit 1) if the shield list is empty after first
# launch, BUGFIX_LAB_ABSENT (exit 0) if the defaults populated.
name: bugfix-lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Build debug APK
        run: cd android && ./gradlew :app:assembleDebug --console=plain

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-30-google_apis-x86_64-v1

      - name: Boot emulator, run oracle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/bugfix-lab/noscroll-android-blocking-not-active.sh

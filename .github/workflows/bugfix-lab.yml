# bugfix-lab controlled environment for cluster
# noscroll-android-prerelease-ui-missing-not-documented.
#
# Manual dispatch only. Builds the app from an arbitrary ref, installs it on
# a real Android emulator, opens it, and reports what is on the first screen.
# Nothing here changes the app.
name: bugfix-lab

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "commit of this repo to build and run"
        required: true
        default: "7d1c27ae8e11c551c1c11f82125a29b3f9bbf505"

permissions:
  contents: read

jobs:
  android-first-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: src

      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build, install, open, observe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash harness/scripts/bugfix-lab/noscroll-android-prerelease-ui.sh "$GITHUB_WORKSPACE/src" "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bugfix-lab-out-${{ inputs.ref }}
          path: out
          if-no-files-found: warn

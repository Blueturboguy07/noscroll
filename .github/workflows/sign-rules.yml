name: Sign rule bundles

# Signs every rule bundle with the private key in the repo secret
# RULES_SIGNING_KEY, copies the signed bundles into the iOS and Android
# resources, and commits them. The private key never leaves the secret: it is
# not printed, not written to disk and not committed.
#
# ed25519 signatures are deterministic. A run on bundles that are already
# signed changes nothing and makes no commit.
#
# After a merge, run it by hand (Actions > Sign rule bundles > Run workflow)
# on any branch whose rule bundles changed.
on:
  push:
    branches: [signin-gate]
    paths:
      - 'rules/**'
      - 'keys/**'
      - 'tools/sign-bundle.mjs'
      - '.github/workflows/sign-rules.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sign-rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Sign every rule bundle
        env:
          RULES_SIGNING_KEY: ${{ secrets.RULES_SIGNING_KEY }}
        run: |
          if [ -z "$RULES_SIGNING_KEY" ]; then
            echo "::error::The repo secret RULES_SIGNING_KEY is not set."
            exit 1
          fi
          node tools/sign-bundle.mjs sign rules/*.json
      - name: Verify with the committed public key
        run: node tools/sign-bundle.mjs verify rules/*.json
      - name: Copy the signed bundles into the apps
        run: |
          cp rules/*.json ios/NoScroll/Resources/Rules/
          cp rules/*.json android/app/src/main/assets/rules/
      - name: Commit the signatures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules ios/NoScroll/Resources/Rules android/app/src/main/assets/rules
          if git diff --cached --quiet; then
            echo "All rule bundles are already signed with the current key."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "Sign rule bundles with the current key (sign-rules workflow)"
          git push origin "HEAD:${GITHUB_REF_NAME}"

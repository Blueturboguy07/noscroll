name: bugfix-lab

# Oracle for cluster noscroll-windows-bash-sync-engine-script.
#
# Reporters (Aug 4 + Aug 7 2026, pre-Aug-10 guide pin) hit the guide's
# build-engine step running `bash tools/sync-engine.sh` on a plain Windows
# box where bash was not on PATH -- one from cmd.exe, one from PowerShell.
# The guide was repinned Aug 10 (commit b9e2b41 in publik) to run
# `node tools/sync-engine.mjs` instead, at noscroll commit 7d1c27ae.
#
# This workflow tests BOTH commits, in BOTH shells:
#   mode "today"             -> ref 7d1c27ae..., command `node tools/sync-engine.mjs`
#                                (what a guide-installer runs right now)
#   mode "negative-control"  -> ref 6e033662..., command `bash tools/sync-engine.sh`
#                                (what the guide made them run before Aug 10)
#
# Two things GitHub's windows-latest runner has that the reporters' machines
# plainly did not (their own screenshots/text prove bash did not resolve for
# them):
#   1. Git for Windows on PATH, whose bin dirs carry a real bash.exe.
#   2. C:\Windows\System32\bash.exe, the built-in WSL launcher stub, which
#      when no WSL distro is installed prints its own "Windows Subsystem for
#      Linux has no installed distributions" message instead of resolving to
#      a real bash -- a DIFFERENT error than "not recognized" but the same
#      functional outcome (the build-engine step still cannot complete).
# The sanitize step strips PATH entries mentioning git and best-effort moves
# the WSL stub aside, so the negative-control leg actually observes a failure
# instead of silently succeeding on CI's different machine. Classification is
# functional-outcome based (LAB.md's own oracle text: the success line ending
# the step is what "fixed" looks like; anything else is "still broken"),
# which is robust to exactly which of those two different failure texts shows
# up, and is done entirely in PowerShell (regardless of which shell is under
# test) to avoid cmd.exe's batch-parenthesized-if fragility.

on:
  workflow_dispatch: {}
  # workflow_dispatch alone 404s via `gh workflow run` until the file exists
  # on the repo's default branch. Since this branch isn't merged yet, also
  # trigger on push to this fix branch (prior art: sibling bugfix-lab session
  # 2026-09-19, branch fix/publik-guide-npm-ps1-execution-policy-windows,
  # commit f506ed4).
  push:
    branches:
      - fix/noscroll-windows-bash-sync-engine-script

jobs:
  oracle:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: today
            shell_kind: pwsh
            ref: 7d1c27ae8e11c551c1c11f82125a29b3f9bbf505
            command: node tools/sync-engine.mjs
          - mode: today
            shell_kind: cmd
            ref: 7d1c27ae8e11c551c1c11f82125a29b3f9bbf505
            command: node tools/sync-engine.mjs
          - mode: negative-control
            shell_kind: pwsh
            ref: 6e033662b03ed0b8adb7fba5d2dac2f23cf06468
            command: bash tools/sync-engine.sh
          - mode: negative-control
            shell_kind: cmd
            ref: 6e033662b03ed0b8adb7fba5d2dac2f23cf06468
            command: bash tools/sync-engine.sh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - uses: pnpm/action-setup@v4
        with: { version: 9 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: engine/pnpm-lock.yaml

      - name: Diagnostic - bash resolution before sanitizing
        shell: pwsh
        run: |
          $bashCmd = Get-Command bash -ErrorAction SilentlyContinue
          if ($bashCmd) {
            Write-Host "bash resolves on this runner's default PATH at: $($bashCmd.Source)"
          } else {
            Write-Host "bash does NOT resolve on this runner's default PATH"
          }

      - name: Sanitize environment to emulate a plain Windows box (no bash resolves)
        shell: pwsh
        run: |
          # 1) Strip any PATH entry mentioning git -- removes Git for Windows' bash.
          $parts = $env:PATH -split ';' | Where-Object { $_.Length -gt 0 }
          $filtered = $parts | Where-Object { $_ -notmatch '(?i)git' }
          $removedCount = $parts.Count - $filtered.Count
          $newPath = ($filtered -join ';')
          Add-Content -Path $env:GITHUB_ENV -Value "PATH=$newPath"
          Write-Host "Removed $removedCount PATH entr$(if ($removedCount -eq 1) {'y'} else {'ies'}) mentioning 'git'."

          # 2) Best-effort: move aside the built-in WSL bash.exe launcher stub in
          # System32, if present, so it can't stand in for a real bash either.
          $wslStub = "$env:WINDIR\System32\bash.exe"
          if (Test-Path $wslStub) {
            try {
              Rename-Item -Path $wslStub -NewName "bash.exe.bugfixlab-disabled" -ErrorAction Stop
              Write-Host "Renamed $wslStub aside."
            } catch {
              Write-Host "Could not rename $wslStub aside ($($_.Exception.Message)) -- will rely on output-content classification for this stub instead."
            }
          } else {
            Write-Host "No WSL bash.exe launcher stub present at $wslStub."
          }

      - name: Diagnostic - bash resolution after sanitizing
        shell: pwsh
        run: |
          $bashCmd = Get-Command bash -ErrorAction SilentlyContinue
          if ($bashCmd) {
            Write-Host "bash STILL resolves at: $($bashCmd.Source) -- sanitizing did not fully remove it"
          } else {
            Write-Host "bash does not resolve -- PATH now matches the reporters' machines"
          }

      - name: Install engine dependencies (guide step 6)
        shell: pwsh
        run: |
          pnpm install --dir engine
          if ($LASTEXITCODE -ne 0) {
            Write-Host "engine dependency install failed (exit $LASTEXITCODE) -- cannot evaluate the build-engine step"
            Write-Host "BUGFIX_LAB_INCONCLUSIVE"
            exit 2
          }

      - name: Run guide step 8 command and classify
        shell: pwsh
        run: |
          $cmd = "${{ matrix.command }}"
          $shellKind = "${{ matrix.shell_kind }}"
          Write-Host "Running (as $shellKind would run this guide step): $cmd"

          $output = ""
          $exit = $null
          if ($shellKind -eq "cmd") {
            # Exercise cmd.exe's OWN command resolution, exactly like a reader
            # pasting this into a cmd.exe prompt.
            $output = (& cmd.exe /c "$cmd 2>&1" | Out-String)
            $exit = $LASTEXITCODE
          } else {
            # Exercise PowerShell's OWN command resolution. An unknown command
            # here is a terminating CommandNotFoundException, not a normal
            # nonzero exit, so it has to be caught.
            try {
              $output = (Invoke-Expression $cmd 2>&1 | Out-String)
              $exit = $LASTEXITCODE
            } catch {
              $output = $_.Exception.Message
              $exit = 1
            }
          }

          Write-Host "----- captured output -----"
          Write-Host $output
          Write-Host "----- exit code: $exit -----"

          # Functional-outcome classification (LAB.md's own oracle text): the
          # guide step is only done when this exact line appears. Anything
          # else -- "not recognized", the WSL-stub's no-distro message, or any
          # other failure -- is the build-engine step still being broken on
          # Windows, which is the functional outcome the reporters hit.
          $successMarker = "engine + rules synced to both shells"
          if ($output -match [regex]::Escape($successMarker)) {
            Write-Host "BUGFIX_LAB_ABSENT (build-engine step succeeded)"
            exit 0
          } else {
            Write-Host "BUGFIX_LAB_PRESENT (build-engine step did not succeed -- see captured output above for why)"
            exit 1
          }

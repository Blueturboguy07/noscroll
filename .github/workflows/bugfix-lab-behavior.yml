# bugfix-lab BEHAVIOURAL controlled environment for
# noscroll-android-blocking-not-active.
#
# The sibling workflow (bugfix-lab.yml) checks the app's persisted shield LIST.
# This one checks the thing the reporter actually complained about: open a
# shielded app and see whether anything gets blocked.
#
# api-level is an input because the reporter is on a real 2026 phone, not an
# API 30 device; targetSdk here is 34 and background-activity-start rules
# differ sharply across those levels.
name: bugfix-lab-behavior

on:
  workflow_dispatch:
    inputs:
      api-level:
        description: Android API level to run the oracle on
        required: false
        default: "34"

permissions:
  contents: read

jobs:
  android-behaviour-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Build debug APK
        run: cd android && ./gradlew :app:assembleDebug --console=plain

      - name: Build the shielded-app fixture (code-free APK named com.instagram.android)
        run: |
          set -euxo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          PLATFORM="$(ls -d "$SDK"/platforms/android-3[0-9] | sort -V | tail -1)"
          echo "build-tools: $BT   platform: $PLATFORM"
          mkdir -p stub
          cat > stub/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.instagram.android">
            <application android:hasCode="false" android:label="IG Fixture">
              <activity android:name="android.app.Activity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          "$BT/aapt2" link -I "$PLATFORM/android.jar" \
            --manifest stub/AndroidManifest.xml \
            --min-sdk-version 26 --target-sdk-version 34 \
            -o stub-unsigned.apk
          keytool -genkeypair -keystore stub.jks -storepass android -keypass android \
            -alias stub -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=bugfix-lab-stub"
          "$BT/zipalign" -f 4 stub-unsigned.apk stub-aligned.apk
          "$BT/apksigner" sign --ks stub.jks --ks-pass pass:android --key-pass pass:android \
            --out stub-ig.apk stub-aligned.apk
          "$BT/aapt2" dump packagename stub-ig.apk

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, run behavioural oracle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ github.event.inputs.api-level || '34' }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/bugfix-lab/noscroll-android-blocking-behavior.sh

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shield-check-${{ github.event.inputs.api-level || '34' }}
          path: shield-check.png
          if-no-files-found: ignore
